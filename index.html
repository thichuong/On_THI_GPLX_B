<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ôn Thi Sát Hạch GPLX 600 Câu (2025)</title>
  <meta name="description" content="Ứng dụng luyện thi lý thuyết sát hạch lái xe ô tô / mô tô 600 câu hỏi mới nhất năm 2025. Thi thử 30 câu (20 phút) chuẩn Cục CSGT, Thi nhanh 20 câu (10 phút) có câu điểm liệt, bấm giờ và chấm điểm tự động." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#0B0F19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ôn Thi GPLX" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <!-- Header Navbar -->
  <header class="app-header">
    <div class="brand-container">
      <div class="brand-logo">
        <img src="/logo.svg" alt="Logo Ôn Thi Sát Hạch 600 Câu" width="38" height="38" />
      </div>
      <div class="brand-info">
        <h1>Ôn Thi Sát Hạch 600 Câu</h1>
        <p>Bộ câu hỏi Luật TTATGTĐB 2025 (Cục CSGT)</p>
      </div>
    </div>

    <!-- Navigation Modes -->
    <nav class="nav-tabs" aria-label="Chế độ học">
      <button class="tab-btn active" data-mode="exam">
        <span>📝 Thi Thử (30 Câu)</span>
      </button>
      <button class="tab-btn" data-mode="quick-exam">
        <span>⚡ Thi Nhanh (20 Câu)</span>
      </button>
      <button class="tab-btn" data-mode="critical">
        <span>⚠️ 60 Câu Điểm Liệt</span>
      </button>
      <button class="tab-btn" data-mode="chapter">
        <span>📚 Ôn Theo Chương</span>
      </button>
      <button class="tab-btn" data-mode="all">
        <span>🔍 Tra Cứu 600 Câu</span>
      </button>
      <button class="tab-btn" data-mode="mistakes">
        <span>❌ Câu Sai</span>
      </button>
      <button class="tab-btn" data-mode="bookmarks">
        <span>⭐ Đã Lưu</span>
      </button>
    </nav>

    <!-- Mobile Menu Trigger Button (Visible on mobile <= 768px) -->
    <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Mở menu chọn chế độ" aria-expanded="false" aria-controls="mobile-mode-sheet">
      <div class="mobile-menu-btn-content">
        <span class="mobile-menu-btn-icon" id="mobile-current-icon">📝</span>
        <div class="mobile-menu-btn-labels">
          <span class="mobile-menu-btn-sub">Chế độ đang chọn</span>
          <span class="mobile-menu-btn-title" id="mobile-current-title">Thi Thử (30 Câu)</span>
        </div>
      </div>
      <div class="mobile-menu-btn-action">
        <span class="mobile-menu-btn-pill">Đổi</span>
        <svg class="mobile-menu-btn-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </div>
    </button>

    <!-- Header Actions -->
    <div class="header-actions">
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Chuyển đổi Giao diện Sáng / Tối" aria-label="Toggle Theme">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- Main Dynamic Content Container -->
  <main id="app-main" class="app-container">
    <!-- Dynamic Views will render here via main.js -->
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>© 2025 Ứng dụng Ôn thi Sát hạch Lái xe 600 Câu Hỏi. Biên soạn theo tài liệu Cục Cảnh sát giao thông & Luật Trật tự, ATGT đường bộ.</p>
  </footer>

  <!-- Result Modal -->
  <div id="result-modal" class="modal-backdrop" aria-hidden="true" role="dialog">
    <!-- Content injected by main.js -->
  </div>

  <!-- Lightbox Zoom Modal -->
  <div id="lightbox-modal" class="modal-backdrop lightbox-modal" aria-hidden="true" role="dialog">
    <div class="modal-content">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Hình phóng to" />
      <button id="close-lightbox-btn" class="btn-nav btn-primary" style="margin-top: 1rem;">
        ✕ Đóng Xem Lại
      </button>
    </div>
  </div>

  <!-- Mobile Mode Selection Bottom Sheet -->
  <div id="mobile-mode-sheet" class="mobile-sheet-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="mobile-sheet-title">
    <div class="mobile-sheet-container">
      <div class="mobile-sheet-handle-bar">
        <span class="mobile-sheet-handle"></span>
      </div>
      <div class="mobile-sheet-header">
        <div class="mobile-sheet-title-box">
          <h2 id="mobile-sheet-title" class="mobile-sheet-title">Chọn Chế Độ Học & Thi</h2>
          <p class="mobile-sheet-subtitle">Chạm để chuyển nhanh chế độ luyện thi</p>
        </div>
        <button id="close-mobile-sheet-btn" class="mobile-sheet-close-btn" aria-label="Đóng bảng chọn">✕</button>
      </div>
      <div class="mobile-sheet-content">
        <div class="mobile-mode-list" role="list">
          <!-- 1. Thi Thử -->
          <button class="mobile-mode-card active" data-mode="exam" role="listitem">
            <div class="mode-card-icon mode-exam">📝</div>
            <div class="mode-card-info">
              <div class="mode-card-name">Thi Thử Chuẩn (30 Câu)</div>
              <div class="mode-card-desc">Cấu trúc đề chuẩn Cục CSGT, bấm giờ 20 phút</div>
            </div>
            <div class="mode-card-status">
              <span class="mode-active-indicator">✓</span>
            </div>
          </button>

          <!-- 2. Thi Nhanh -->
          <button class="mobile-mode-card" data-mode="quick-exam" role="listitem">
            <div class="mode-card-icon mode-quick">⚡</div>
            <div class="mode-card-info">
              <div class="mode-card-name">Thi Nhanh Cấp Tốc (20 Câu)</div>
              <div class="mode-card-desc">Rút gọn 10 phút, kiểm tra nhanh kiến thức</div>
            </div>
            <div class="mode-card-status">
              <span class="mode-active-indicator">✓</span>
            </div>
          </button>

          <!-- 3. Điểm Liệt -->
          <button class="mobile-mode-card" data-mode="critical" role="listitem">
            <div class="mode-card-icon mode-critical">⚠️</div>
            <div class="mode-card-info">
              <div class="mode-card-name">60 Câu Điểm Liệt</div>
              <div class="mode-card-desc">Bắt buộc đúng 100%, sai 1 câu là không đạt</div>
            </div>
            <div class="mode-card-status">
              <span class="mode-active-indicator">✓</span>
            </div>
          </button>

          <!-- 4. Ôn Theo Chương -->
          <button class="mobile-mode-card" data-mode="chapter" role="listitem">
            <div class="mode-card-icon mode-chapter">📚</div>
            <div class="mode-card-info">
              <div class="mode-card-name">Ôn Tập Theo Chương</div>
              <div class="mode-card-desc">Luyện kỹ theo 6 chương giáo trình lý thuyết</div>
            </div>
            <div class="mode-card-status">
              <span class="mode-active-indicator">✓</span>
            </div>
          </button>

          <!-- 5. Tra Cứu 600 Câu -->
          <button class="mobile-mode-card" data-mode="all" role="listitem">
            <div class="mode-card-icon mode-all">🔍</div>
            <div class="mode-card-info">
              <div class="mode-card-name">Tra Cứu 600 Câu Hỏi</div>
              <div class="mode-card-desc">Tìm kiếm từ khóa, xem toàn bộ đề và lời giải</div>
            </div>
            <div class="mode-card-status">
              <span class="mode-active-indicator">✓</span>
            </div>
          </button>

          <!-- 6. Câu Sai -->
          <button class="mobile-mode-card" data-mode="mistakes" role="listitem">
            <div class="mode-card-icon mode-mistakes">❌</div>
            <div class="mode-card-info">
              <div class="mode-card-name">Danh Sách Câu Hay Sai</div>
              <div class="mode-card-desc">Gom các câu đã từng làm sai để làm lại cho nhớ</div>
            </div>
            <div class="mode-card-status">
              <span class="mode-active-indicator">✓</span>
            </div>
          </button>

          <!-- 7. Đã Lưu -->
          <button class="mobile-mode-card" data-mode="bookmarks" role="listitem">
            <div class="mode-card-icon mode-bookmarks">⭐</div>
            <div class="mode-card-info">
              <div class="mode-card-name">Câu Hỏi Đã Đánh Dấu</div>
              <div class="mode-card-desc">Danh sách câu hỏi quan trọng bạn tự lưu</div>
            </div>
            <div class="mode-card-status">
              <span class="mode-active-indicator">✓</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
